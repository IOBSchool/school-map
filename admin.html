<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面｜スクール生のお店マップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← 地図にもどる</a>
    <h1>お店マップ 管理画面</h1>
    <div id="msg"></div>

    <form id="login" class="gate-box" style="margin:24px auto">
      <p class="lead">管理者のメールアドレスとパスワードでログインしてください。</p>
      <div class="field"><input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required></div>
      <div class="field"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required></div>
      <button class="btn" type="submit">ログイン</button>
    </form>

    <section id="panel" hidden>
      <div class="tabs" id="tabs">
        <button data-s="pending" class="on">承認待ち</button>
        <button data-s="approved">公開中</button>
        <button data-s="rejected">見送り</button>
      </div>
      <div id="list"></div>
      <button class="btn sub" id="logout" type="button">ログアウト</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
