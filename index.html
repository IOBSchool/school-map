<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f9f7ef">
  <title>スクール生のお店マップ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Old+Mincho:wght@700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>(function(){var t=new URLSearchParams(location.search).get("theme");if(/^[1-5]$/.test(t||""))document.documentElement.dataset.theme=t;})();</script>
</head>
<body>
  <!-- パスワード画面 -->
  <div class="gate" id="gate">
    <form class="gate-box" id="gateForm">
      <h1>スクール生のお店マップ</h1>
      <p>スクール生限定のページです。<br>共通パスワードを入れてください。</p>
      <input type="password" id="gatePw" placeholder="パスワード" autocomplete="current-password" required>
      <div class="gate-err" id="gateErr"></div>
      <button class="btn" type="submit">地図をひらく</button>
    </form>
  </div>

  <!-- 地図 -->
  <div id="map"></div>

  <header class="topbar">
    <div class="topbar-row">
      <h1>スクール生のお店マップ</h1>
      <a class="add-link" href="submit.html">＋ お店を登録</a>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </header>

  <button class="locate" id="locateBtn" type="button">◎ 現在地から探す</button>

  <!-- 詳細シート -->
  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
